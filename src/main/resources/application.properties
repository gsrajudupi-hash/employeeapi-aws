spring.application.name=employeeapi-aws


server.port=8087

# Amazon RDS MySQL Configuration
#These are environment variables. We will configure them on EC2.

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/trainingdb?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
